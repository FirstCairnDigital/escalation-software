# First Cairn Digital
# P26003 CI/CD and reproducible dependency checks

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install reproducible dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint constraints.txt --requirement requirements.txt .

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Validate packaging metadata
        run: pip check

      - name: Dependency vulnerability scan
        run: |
          python -m pip install pip-audit
          pip-audit --requirement requirements.txt --constraint constraints.txt --desc

      - name: Check for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
