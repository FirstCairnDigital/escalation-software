# First Cairn Digital
# P26003 CI/CD and reproducible dependency checks

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install reproducible dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint constraints.txt --requirement requirements.txt .

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Validate packaging metadata
        run: pip check

      - name: Dependency vulnerability scan
        run: |
          python -m pip install pip-audit
          pip-audit --requirement requirements.txt --desc

      - name: Check for committed secrets
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          GITLEAKS_CHECKSUMS="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          GITLEAKS_BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSL "${GITLEAKS_BASE_URL}/${GITLEAKS_ARCHIVE}" -o "${GITLEAKS_ARCHIVE}"
          curl -sSL "${GITLEAKS_BASE_URL}/${GITLEAKS_CHECKSUMS}" -o "${GITLEAKS_CHECKSUMS}"
          grep " ${GITLEAKS_ARCHIVE}$" "${GITLEAKS_CHECKSUMS}" | sha256sum --check --status --
          tar -xzf "${GITLEAKS_ARCHIVE}" gitleaks
          chmod +x ./gitleaks
          ./gitleaks git . --no-banner
